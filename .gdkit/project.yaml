study_question: Can a weight-space edit remove the refusal direction from an instruction-tuned
  LLM such that, after the edit, a linear probe on the base model's activations no
  longer separates harmful from harmless prompts beyond its null-control and permutation
  baselines on held-out categories, while attack success on a held-out harmful set
  reaches its pre-registered ceiling at a pre-registered capability cost — comparable
  to Abliteration, Heretic and Obliteratus?
claim_type: safety
