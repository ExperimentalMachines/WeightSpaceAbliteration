[project]
name = "wsablate"
version = "0.1.0"
description = "Pre-registered study of weight-space refusal-direction removal in instruction-tuned language models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "gdkit @ git+https://github.com/arjhinety/gdkit@fa1e4d57b42b6e32d5351340fe12cc15d0357b41",
    "pyyaml>=6",
    "numpy>=1.26",
    "torch>=2.3",
    "transformers>=4.44",
    "pyarrow>=15",
    "lm-eval>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
