intended_use: The candidates produced here are research artifacts for measuring whether
  refusal behaviour is mediated by a removable direction, and for comparing weight-space
  editing methods under a fixed evaluation. They are not for deployment, not for serving
  to users, and not for any task in which refusal behaviour is relied upon for safety.
  The ablated weights, if released, are released under controlled access with the
  base model's licence terms attached and an explicit statement that refusal behaviour
  is known to be degraded. The evaluation corpus is published as hashes, exclusion
  lists and a fetch script rather than redistributed rows, because the benign arm
  inherits non-commercial terms from Alpaca.
